# clickart-config-repo/discovery-server.yml
server:
  port: 8761 # Standard Eureka port

eureka:
  instance:
    hostname: localhost
    # prefer-ip-address: true
  client:
    register-with-eureka: false # Do not register yourself
    fetch-registry: false # Do not pull registries from others

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0 # Force 100% of requests to be traced (for dev only, lower for prod)
  zipkin:
    tracing:
      endpoint: http://clickart-zipkin:9411/api/v2/spans