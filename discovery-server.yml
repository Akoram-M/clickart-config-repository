# clickart-config-repo/discovery-server.yml
server:
  port: 8761 # Standard Eureka port

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false # Do not register yourself
    fetch-registry: false # Do not pull registries from others

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}