# DEFAULT PROFILE
server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

---
# DOCKER PROFILE
spring:
  config:
    activate:
      on-profile: docker

eureka:
  client:
    service-url:
      defaultZone: http://clickart-discovery-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0 # Force 100% of requests to be traced (for dev only, lower for prod)
  zipkin:
    tracing:
      endpoint: http://clickart-zipkin:9411/api/v2/spans