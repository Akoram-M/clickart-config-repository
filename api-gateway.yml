# clickart-config-repo/api-gateway.yml
# DEFAULT PROFILE: Active when running locally via terminal/IDE
server:
  port: 8083

spring:
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]': # Apply to all routes
            allowedOrigins: "http://localhost:3000" # Allow the Next.js frontend
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/clickart-realm
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
# DOCKER PROFILE: Active only when running inside Docker containers
spring:
  config:
    activate:
      on-profile: docker
cloud:
    gateway:
      routes:
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
    oauth2:
      resourceserver:
        jwt:
          # The Validation String (Matches what Postman sees)
          issuer-uri: http://localhost:8081/realms/clickart-realm
          # The Internal Network Path (Where Gateway physically downloads the keys)
          jwk-set-uri: http://clickart-keycloak-1:8080/realms/clickart-realm/protocol/openid-connect/certs
eureka:
  client:
    service-url:
      defaultZone: http://clickart-discovery-server:8761/eureka/