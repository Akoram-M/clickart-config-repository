# DEFAULT PROFILE: Active when running locally via terminal/IDE
server:
  port: 8083

spring:
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**, /product-service/v3/api-docs
          filters:
            - RewritePath=/product-service/(?<segment>.*), /$\{segment}
            - name: CircuitBreaker
              args:
                name: productServiceCircuitBreaker
                fallbackUri: forward:/fallback/product
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**, /order-service/v3/api-docs
          filters:
            - RewritePath=/order-service/(?<segment>.*), /$\{segment}

        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**, /inventory-service/v3/api-docs
          filters:
            - RewritePath=/inventory-service/(?<segment>.*), /$\{segment}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/clickart-realm

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

---
# DOCKER PROFILE: Active only when running inside Docker containers
spring:
  config:
    activate:
      on-profile: docker
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**, /product-service/v3/api-docs
          filters:
            - RewritePath=/product-service/(?<segment>.*), /$\{segment}

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**, /order-service/v3/api-docs
          filters:
            - RewritePath=/order-service/(?<segment>.*), /$\{segment}

        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**, /inventory-service/v3/api-docs
          filters:
            - RewritePath=/inventory-service/(?<segment>.*), /$\{segment}
  security:
    oauth2:
      resourceserver:
        jwt:
          # MUST BE LOCALHOST to match the token generated by Postman on your Mac
          issuer-uri: http://localhost:8081/realms/clickart-realm
          # MUST BE CLICKART-KEYCLOAK-1:8080 to fetch the public keys internally via Docker network
          jwk-set-uri: http://clickart-keycloak-1:8080/realms/clickart-realm/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://clickart-discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0 
  zipkin:
    tracing:
      endpoint: http://clickart-zipkin:9411/api/v2/spans

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Product Service
        url: /product-service/v3/api-docs
      - name: Order Service
        url: /order-service/v3/api-docs
      - name: Inventory Service
        url: /inventory-service/v3/api-docs