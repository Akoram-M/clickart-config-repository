# clickart-config-repo/inventory-service.yml
# DEFAULT PROFILE: Active when running locally via terminal/IDE
server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/inventory_db
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

---
# DOCKER PROFILE: Active only when running inside Docker containers
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://clickart-postgres-1:5432/inventory_db
    
  kafka:
    bootstrap-servers: clickart-kafka-1:29092
    consumer:
      group-id: inventory-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
eureka:
  client:
    service-url:
      defaultZone: http://clickart-discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true
    # Force the instance ID to be the IP address for clarity in the dashboard
    instance-id: ${spring.cloud.client.ip-address}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0 # Force 100% of requests to be traced (for dev only, lower for prod)
  zipkin:
    tracing:
      endpoint: http://clickart-zipkin:9411/api/v2/spans