# clickart-config-repo/inventory-service.yml
# DEFAULT PROFILE: Active when running locally via terminal/IDE
server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/inventory_db
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

---
# DOCKER PROFILE: Active only when running inside Docker containers
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://clickart-postgres-1:5432/inventory_db