# DEFAULT PROFILE
server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/orders_db
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# Add the local URL here
inventory:
  service:
    url: http://localhost:8084

---
# DOCKER PROFILE
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://clickart-postgres-1:5432/orders_db
  kafka:
    bootstrap-servers: clickart-kafka-1:29092

# Add the Docker network URL here
inventory:
  service:
    url: http://clickart-inventory-service:8084