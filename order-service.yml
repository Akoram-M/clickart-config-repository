# DEFAULT PROFILE
server:
  port: 8082

logging:
  level:
    com.zaxxer.hikari.HikariConfig: DEBUG
    com.zaxxer.hikari: TRACE
    
spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/orders_db
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Add the local URL here
inventory:
  service:
    url: http://localhost:8084

---
# DOCKER PROFILE
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://clickart-postgres-1:5432/orders_db
  kafka:
    bootstrap-servers: clickart-kafka-1:29092

eureka:
  client:
    service-url:
      defaultZone: http://clickart-discovery-server:8761/eureka/