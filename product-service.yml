# clickart-config-repo/product-service.yml
# DEFAULT PROFILE: Active when running locally via terminal/IDE
server:
  port: 8080

spring:
  data:
    mongodb:
      uri: mongodb://test:test@localhost:27018/product_db?authSource=admin
     #The format for a MongoDB connection URI is:
     #mongodb://{username}:{password}@{hostname}:{port}/{database}?authSource=admin
    
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

---
# DOCKER PROFILE: Active only when running inside Docker containers
spring:
  config:
    activate:
      on-profile: docker
  data:
    mongodb:
      uri: mongodb://test:test@clickart-mongodb-1:27017/product_db?authSource=admin

eureka:
  client:
    service-url:
      defaultZone: http://clickart-discovery-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0 # Force 100% of requests to be traced (for dev only, lower for prod)
  zipkin:
    tracing:
      endpoint: http://clickart-zipkin:9411/api/v2/spans