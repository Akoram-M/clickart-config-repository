# clickart-config-repo/product-service.yml
# DEFAULT PROFILE: Active when running locally via terminal/IDE
server:
  port: 8080

spring:
  data:
    mongodb:
      uri: mongodb://root:example@localhost:27018/product_db?authSource=admin

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

---
# DOCKER PROFILE: Active only when running inside Docker containers
spring:
  config:
    activate:
      on-profile: docker
  data:
    mongodb:
      uri: mongodb://root:example@clickart-mongodb-1:27017/product_db?authSource=admin

eureka:
  client:
    service-url:
      defaultZone: http://clickart-discovery-server:8761/eureka/